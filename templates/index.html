<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Video Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            border: 1px solid #334155;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input[type="url"] {
            width: 100%;
            padding: 14px 16px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="url"]:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        button:hover {
            opacity: 0.95;
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        #status {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            min-height: 24px;
            word-break: break-word;
        }

        .status-loading {
            color: #38bdf8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-error {
            color: #f87171;
            background: rgba(239, 68, 68, 0.1);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .status-success {
            color: #4ade80;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #38bdf8;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Video Downloader</h1>
        <p class="subtitle">YouTube Shorts, Facebook Reels, Instagram Link পেস্ট করুন</p>

        <form id="downloadForm" onsubmit="handleDownload(event)">
            <div class="input-group">
                <input 
                    type="url" 
                    id="videoUrl" 
                    placeholder="https://..." 
                    required 
                />
                <button type="submit" id="dlBtn">Download Video</button>
            </div>
        </form>

        <div id="status"></div>
    </div>

    <script>
        async function handleDownload(event) {
            event.preventDefault();

            const urlInput = document.getElementById('videoUrl');
            const btn = document.getElementById('dlBtn');
            const status = document.getElementById('status');
            const videoUrl = urlInput.value.trim();

            if (!videoUrl) return;

            btn.disabled = true;
            status.className = 'status-loading';
            status.innerHTML = '<span class="spinner"></span> প্রসেস করা হচ্ছে, একটু অপেক্ষা করুন...';

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: videoUrl })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'ডাউনলোড ব্যর্থ হয়েছে।');
                }

                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;

                const disposition = response.headers.get('Content-Disposition');
                let filename = 'video.mp4';
                if (disposition && disposition.indexOf('filename=') !== -1) {
                    const matches = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/.exec(disposition);
                    if (matches != null && matches[1]) { 
                        filename = matches[1].replace(/['"]/g, '');
                    }
                }

                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);

                status.className = 'status-success';
                status.innerText = '✓ ডাউনলোড সম্পূর্ণ হয়েছে!';
                urlInput.value = '';

            } catch (err) {
                status.className = 'status-error';
                status.innerText = err.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
